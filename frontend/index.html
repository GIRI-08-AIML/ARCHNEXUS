<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ArchNexus</title>
  <script>
    /* Set the theme before the page paints, so a dark-mode user never sees a white flash. */
    (function () {
      var t = "light";
      try {
        t = localStorage.getItem("archnexus.theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) { t = "light"; }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="guest">
  <div class="frame">
    <aside class="side" id="side" aria-label="Main navigation"></aside>
    <div class="side-scrim" id="scrim" hidden></div>
    <div class="col">
      <header class="topbar" id="topbar"></header>
      <div id="banner" role="status" hidden></div>
      <main id="app" tabindex="-1">
        <noscript><div class="wrap"><p class="empty">ArchNexus needs JavaScript to show reviews.</p></div></noscript>
      </main>
      <footer class="wrap foot">
        Reviews and assistant answers are AI-generated first passes, so check important findings yourself.
      </footer>
    </div>
  </div>
  <script src="/ui/app.js"></script>
</body>
</html>
