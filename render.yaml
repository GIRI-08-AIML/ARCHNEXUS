# Render Blueprint: one web service built from the Dockerfile.
# Create the database first (see "Deploying" in the README), then paste its URL when Render asks.
services:
  - type: web
    name: archnexus
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # paste your Neon connection string
      - key: SECRET_KEY
        generateValue: true    # Render creates a long random value
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false            # paste your Groq key
      - key: MAX_SPECIALIST_CONCURRENCY
        value: "2"
